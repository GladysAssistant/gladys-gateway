# Reverse proxy in front of the blue/green slots of the gateway.
#
# The DigitalOcean load balancer terminates TLS and forwards the traffic to this
# server on port 80, with the client address in X-Forwarded-For. The slot that
# receives the traffic is chosen in upstream.conf, rewritten by deploy.sh and
# applied with `nginx -s reload`: the connections already open (websockets) stay
# on the previous slot until they close, the new ones go to the active slot.

# Docker's embedded DNS, queried at request time: nginx starts even when the
# inactive slot does not exist yet, and follows a slot recreated with a new address.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # The gateway limits the bodies itself (5 MB JSON, 25 MB socket.io, backup
    # and camera chunks): nginx only has to stay out of the way
    client_max_body_size 64m;
    # Pass requests and answers through as they come (uploads, long polling,
    # camera streams), like the load balancer does
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # unchanged: the gateway filters it with ALLOWED_HOSTS (/ping is always allowed)
        proxy_set_header Host $host;
        # Appends the address nginx sees (the load balancer) to the header the
        # load balancer built: the gateway trusts two hops (TRUSTED_PROXY_HOPS=2)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Dashboard calls relayed to an instance can last up to 5 minutes
        # (INSTANCE_MESSAGE_TIMEOUT_IN_MS); keep in line with the idle timeout
        # configured on the load balancer
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
